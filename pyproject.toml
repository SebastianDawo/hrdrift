[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrdrift"
version = "1.0.0"
description = "Heart-rate drift (aerobic decoupling) analysis for the Uphill Athlete / Evoke Endurance aerobic threshold test"
readme = "README.md"
authors = [{ name = "SebastianDawo", email = "160727659+SebastianDawo@users.noreply.github.com" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["running", "endurance", "heart-rate", "aerobic-threshold", "decoupling", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Browser-parity tests additionally need node and `npm install @xmldom/xmldom`;
# they skip cleanly when either is missing.

[project.scripts]
hrdrift = "hrdrift.cli:main"

[project.urls]
Source = "https://github.com/SebastianDawo/hrdrift"
Issues = "https://github.com/SebastianDawo/hrdrift/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hrdrift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
